<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 0 370 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3ECDD"/>
      <stop offset="1" stop-color="#E4D9C3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="panelClip"><rect x="130" y="34" width="300" height="600" rx="18"/></clipPath>
  </defs>

  <!-- Popover arrow, same material as the panel -->
  <path d="M280 20 L294 34 L266 34 Z" fill="#1B1B1F"/>

  <!-- Panel -->
  <rect x="130" y="34" width="300" height="600" rx="18" fill="#1B1B1F" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#soft)"/>

  <g clip-path="url(#panelClip)">
    <!-- ===== MeltingMascot: dark space up top, gradient strip lower, 뭉치
         rising from the strip as a gooey mound (as in the real app) ===== -->
    <rect x="130" y="74" width="300" height="22" fill="url(#blob)"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -1.4; 0 0; 0 1; 0 0" keyTimes="0;0.25;0.5;0.75;1"
        dur="3.2s" repeatCount="indefinite"/>
      <!-- mound: hill flaring smoothly into the strip (base sunk 3px so the bob never detaches) -->
      <path d="M254 77 C260 76 263 62 268 58 C272 55 288 55 292 58 C297 62 300 76 306 77 Z" fill="url(#blob)"/>
      <circle cx="273.5" cy="66" r="2.3" fill="#17171B"/>
      <circle cx="286.5" cy="66" r="2.3" fill="#17171B"/>
    </g>

    <!-- ===== Header ===== -->
    <text x="144" y="121" font-size="13" font-weight="600" fill="#F2F2F7">ContextOS</text>
    <circle cx="376" cy="117" r="3" fill="#32D74B">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="416" y="121" text-anchor="end" font-size="11" fill="#98989F">연결됨</text>

    <!-- ===== Hero: cumulative saved tokens — ticks up once per cycle ===== -->
    <g text-anchor="middle" font-weight="600" font-size="30" fill="#F2F2F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="280" y="174">
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.10;0.125;0.25;0.275;1" dur="7s" repeatCount="indefinite"/>285.9만</text>
      <text x="280" y="174">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.14;0.17;0.18;1" dur="7s" repeatCount="indefinite"/>285.5만</text>
      <text x="280" y="174">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.18;0.21;0.22;1" dur="7s" repeatCount="indefinite"/>285.7만</text>
      <text x="280" y="174">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.22;0.25;0.26;1" dur="7s" repeatCount="indefinite"/>285.8만</text>
    </g>
    <text x="280" y="194" text-anchor="middle" font-size="11" fill="#98989F">누적 아낀 토큰</text>

    <!-- ===== Segment summary strip ===== -->
    <rect x="144" y="208" width="272" height="44" rx="9" fill="#FFFFFF" fill-opacity="0.06"/>
    <line x1="234.7" y1="217" x2="234.7" y2="243" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <line x1="325.3" y1="217" x2="325.3" y2="243" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="189.3" y="230" font-size="15" font-weight="600" fill="#F2F2F7">0</text>
      <text x="280" y="230" font-size="15" font-weight="600" fill="#F2F2F7">47</text>
      <text x="370.7" y="230" font-size="15" font-weight="600" fill="#F2F2F7">27.5억</text>
    </g>
    <g text-anchor="middle" font-size="10" fill="#98989F">
      <text x="189.3" y="244">오늘</text>
      <text x="280" y="244">최적화</text>
      <text x="370.7" y="244">AI 사용</text>
    </g>

    <!-- ===== 7-day trend: 일→토, mostly empty, 목 small, 토(오늘) full ===== -->
    <text x="144" y="272" font-size="11" font-weight="600" fill="#98989F">최근 7일 추이</text>
    <g fill="#8E8E93" fill-opacity="0.55">
      <rect x="144.0" y="329" width="28" height="2" rx="1"/>
      <rect x="184.7" y="329" width="28" height="2" rx="1"/>
      <rect x="225.3" y="329" width="28" height="2" rx="1"/>
      <rect x="266.0" y="329" width="28" height="2" rx="1"/>
      <rect x="306.7" y="320" width="28" height="11" rx="2"/>
      <rect x="347.3" y="329" width="28" height="2" rx="1"/>
    </g>
    <rect x="388.0" width="28" rx="3" fill="#EFE7D6">
      <animate attributeName="height" values="46;46;41;46;46" keyTimes="0;0.45;0.6;0.75;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="285;285;290;285;285" keyTimes="0;0.45;0.6;0.75;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <g text-anchor="middle" font-size="9" fill="#98989F">
      <text x="158" y="345">일</text><text x="198.7" y="345">월</text><text x="239.3" y="345">화</text>
      <text x="280" y="345">수</text><text x="320.7" y="345">목</text><text x="361.3" y="345">금</text>
      <text x="402" y="345" fill="#F2F2F7" font-weight="600">토</text>
    </g>

    <!-- ===== Segmented picker: selected tab gets the accent-cream fill ===== -->
    <rect x="144" y="357" width="272" height="24" rx="7" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="146" y="359" width="88" height="20" rx="6" fill="#EFE7D6"/>
    <g text-anchor="middle" font-size="11">
      <text x="190" y="373" fill="#17171B" font-weight="600">프로젝트</text>
      <text x="280" y="373" fill="#98989F">활동</text>
      <text x="370" y="373" fill="#98989F">AI 연결</text>
    </g>

    <!-- ===== Project cards: header row + a single mostly-one-color bar ===== -->
    <rect x="144" y="393" width="272" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
    <path d="M154 405 h9 l3 3 h8 v10 h-20 z" fill="#EFE7D6"/>
    <text x="176" y="411" font-size="13" font-weight="600" fill="#F2F2F7">pycoin</text>
    <text x="176" y="424" font-size="10" fill="#98989F">/Users/choes…esktop/pycoin</text>
    <text x="390" y="414" text-anchor="end" font-size="14" font-weight="600" fill="#F2F2F7" font-family="ui-monospace, Menlo, monospace">22.1억</text>
    <path d="M398 409 l5 5 l5 -5" stroke="#98989F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="154" y="435" width="242" height="6" rx="3" fill="#EFE7D6"/>
    <rect x="392" y="435" width="14" height="6" rx="3" fill="#0A84FF"/>

    <rect x="144" y="457" width="272" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
    <path d="M154 469 h9 l3 3 h8 v10 h-20 z" fill="#EFE7D6"/>
    <text x="176" y="475" font-size="13" font-weight="600" fill="#F2F2F7">ContextOS</text>
    <text x="176" y="488" font-size="10" fill="#98989F">/Users/choesa…top/ContextOS</text>
    <text x="390" y="478" text-anchor="end" font-size="14" font-weight="600" fill="#F2F2F7" font-family="ui-monospace, Menlo, monospace">6.6억</text>
    <path d="M398 473 l5 5 l5 -5" stroke="#98989F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="154" y="499" width="244" height="6" rx="3" fill="#EFE7D6"/>
    <rect x="400" y="499" width="6" height="6" rx="3" fill="#0A84FF"/>

    <rect x="144" y="521" width="272" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
    <path d="M154 533 h9 l3 3 h8 v10 h-20 z" fill="#EFE7D6"/>
    <text x="176" y="539" font-size="13" font-weight="600" fill="#F2F2F7">soultion1</text>
    <text x="176" y="552" font-size="10" fill="#98989F">/Users/choes…ents/soultion1</text>
    <text x="390" y="542" text-anchor="end" font-size="14" font-weight="600" fill="#F2F2F7" font-family="ui-monospace, Menlo, monospace">10.4만</text>
    <path d="M398 537 l5 5 l5 -5" stroke="#98989F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="154" y="563" width="252" height="6" rx="3" fill="#0A84FF"/>

    <!-- ===== Footer: checked launch-at-login + refresh/quit ===== -->
    <line x1="144" y1="587" x2="416" y2="587" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="144" y="597" width="13" height="13" rx="3" fill="#EFE7D6"/>
    <path d="M147 604 l3 3 l6 -7" stroke="#17171B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="163" y="608" font-size="10" fill="#C7C7CC">로그인 시 시작</text>
    <g stroke="#98989F" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M394.2 599.5 A5.5 5.5 0 1 0 399.8 599.5"/>
      <path d="M397 596 l3.2 1.7 l-2 3.1" fill="none"/>
      <path d="M409 599 A5.2 5.2 0 1 0 416 599"/>
      <line x1="412.5" y1="594.5" x2="412.5" y2="601"/>
    </g>
  </g>

  <!-- ===== Caption ===== -->
  <text x="280" y="664" text-anchor="middle" font-size="12" fill="#8E8E93">Claude Code에 질문  →  ContextOS가 관련 파일·함수만 골라 전달  →  토큰 절약</text>
</svg>
